name: Build and release KMSA

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - run: npm test
      - run: npm run check:native
      - run: npm run build
      - name: Verify native bundle without audio playback
        run: |
          "output/native/Keep My Speakers Awake.app/Contents/MacOS/KMSA" --self-check
          "output/native/Keep My Speakers Awake.app/Contents/MacOS/KMSA" --update-self-check
      - name: Prepare isolated DMG layout tools
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 -m venv "$RUNNER_TEMP/kmsa-dmg-tools"
          "$RUNNER_TEMP/kmsa-dmg-tools/bin/python" -m pip install -r scripts/dmg-requirements.txt
          echo "KMSA_DMG_PYTHON=$RUNNER_TEMP/kmsa-dmg-tools/bin/python" >> "$GITHUB_ENV"
      - name: Package and verify the release DMG
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KMSA_EXPECTED_TAG: ${{ github.ref_name }}
        run: npm run package:dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: kmsa-release
          path: output/releases/
          if-no-files-found: error
          retention-days: 14

  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: landing
      - name: Verify localized static HTML and social metadata
        run: npm run build:kmsa
        working-directory: landing

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [build, landing]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: kmsa-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kmsa-release
          path: output/releases/
      - name: Verify transported artifact checksum
        working-directory: output/releases
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish only after all checks and asset uploads pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run publish:release
