name: Build and release KMSA

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - run: npm test
      - run: npm run check:native
      - run: npm run build
      - name: Verify native bundle without audio playback
        run: |
          "output/native/Keep My Speakers Awake.app/Contents/MacOS/KMSA" --self-check
          "output/native/Keep My Speakers Awake.app/Contents/MacOS/KMSA" --update-self-check

  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: landing
      - name: Verify localized static HTML and social metadata
        run: npm run build:kmsa
        working-directory: landing

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [build, landing]
    runs-on: macos-15
    timeout-minutes: 20
    concurrency:
      group: kmsa-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Prepare isolated DMG layout tools
        run: |
          python3 -m venv "$RUNNER_TEMP/kmsa-dmg-tools"
          "$RUNNER_TEMP/kmsa-dmg-tools/bin/python" -m pip install -r scripts/dmg-requirements.txt
          echo "KMSA_DMG_PYTHON=$RUNNER_TEMP/kmsa-dmg-tools/bin/python" >> "$GITHUB_ENV"
      - name: Download the locally signed and notarized draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir output/releases \
            --pattern Keep-My-Speakers-Awake-Apple-Silicon.dmg \
            --pattern SHA256SUMS.txt --pattern release-manifest.json
      - name: Verify Apple's signatures, notarization, DMG layout and source provenance
        env:
          KMSA_EXPECTED_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release.mjs
      - name: Publish only after all checks and asset uploads pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run publish:release
